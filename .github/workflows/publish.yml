# PyPI Trusted Publishing for stayput.
# Must remain named publish.yml to match the PyPI Trusted Publisher.
#
# Publishes from an intentional GitHub Release tag (e.g. v0.1.0).
# Uses GitHub OIDC — no PyPI API token, password, or long-lived secret.
# Runtime dependency salt-grain==0.1.0 resolves from public PyPI.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install -U pip build twine
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Pytest
        run: python -m pytest -q

      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*

      - name: Fresh-wheel qualification
        run: |
          python -m venv /tmp/stayput-release-qual
          /tmp/stayput-release-qual/bin/python -m pip install -U pip
          wheel="$(ls dist/stayput-*.whl | head -n1)"
          /tmp/stayput-release-qual/bin/python -m pip install "$wheel"
          /tmp/stayput-release-qual/bin/python - <<'PY'
          import importlib.metadata
          from stayput import (
              CAPABILITY_VERSION,
              __version__,
              digest_snapshot,
              snapshot,
              verify_approval,
              build_approval,
          )

          meta = importlib.metadata.metadata("stayput")
          assert meta["Name"] == "stayput"
          assert meta["Version"] == "0.1.0"
          assert __version__ == "0.1.0"
          assert importlib.metadata.version("stayput") == "0.1.0"
          assert importlib.metadata.version("salt-grain") == "0.1.0"
          assert CAPABILITY_VERSION == "0.1.0"

          snap = snapshot(
              repo_id="3073f9a9961e954de80ca5ae1239813d1e3e7e36",
              base_commit="1a09b140a9c21ec2d47dd07ce385a348bf78820d",
          )
          assert digest_snapshot(snap) == digest_snapshot(snap)
          checked = verify_approval(build_approval(snap))
          assert checked["ok"] is True
          print("RELEASE_QUALIFICATION_OK")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stayput
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
