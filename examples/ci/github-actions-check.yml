# Documentation example — not a custom GitHub Action product.
# StayPut remains an ordinary CLI. Copy into a consumer workflow.
#
# Honor the process exit code (0 MATCH, 1 ERROR, 2 MISMATCH).
# Do not gate on JSON "ok": true — MISMATCH also has ok=true.
name: stayput-check
on:
  pull_request:
  push:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install StayPut
        run: pip install stayput
      - name: CHECK sealed approval
        run: stayput check --json
